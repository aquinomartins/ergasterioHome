name: Gerar pacote para Superdomínios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:hosting
      - uses: actions/upload-artifact@v4
        with:
          name: ergasterio-superdominios
          path: dist-hosting/
          if-no-files-found: error
          retention-days: 14
